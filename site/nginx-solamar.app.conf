# solamar.app on the WSBusinesslab dedi: the landing page as static files in /var/www/solamar.app (site/deploy.sh
# puts them there). Lives at /etc/nginx/sites-available/solamar.app, linked from sites-enabled. Certificate from
# `certbot certonly --webroot -w /var/www/solamar.app -d solamar.app -d www.solamar.app`, renewed by certbot's timer.

server {
    listen 80;
    listen [::]:80;
    server_name solamar.app www.solamar.app;

    location /.well-known/acme-challenge/ {
        root /var/www/solamar.app;
    }
    location / {
        return 301 https://solamar.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.solamar.app;
    ssl_certificate /etc/letsencrypt/live/solamar.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solamar.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://solamar.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solamar.app;
    ssl_certificate /etc/letsencrypt/live/solamar.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solamar.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/solamar.app;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
    }
}
