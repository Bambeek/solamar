<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">Solamar</title>
<desc id="d">Solamar, the open-source browser after Arc: spaces, ad blocking and an AI agent built in, Arc import, Claude Code. An isometric browser window with three space pills and titled tabs; space tiles fly into it from an open moving box marked ARC, and the AI agent's glowing sparkle and cursor hover over a tab of its own.</desc>
