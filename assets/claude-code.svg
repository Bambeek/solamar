<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">Claude Code drives Solamar</title>
<desc id="d">How Claude Code drives Solamar, in four steps. 01 Ask Claude Code in your terminal; claude mcp add solamar connects it once. 02 Solamar runs a local MCP server on this computer only, 127.0.0.1 port 47821, with a secret token. 03 Claude Code works in its own Claude space: it opens tabs, reads, clicks and types, and you can watch or stop it. 04 Your own tabs stay out of reach unless you share one; payments always wait for your click.</desc>
