<text x="415" y="40" font-size="15" font-weight="650" class="ink"><tspan class="mono acc" font-size="10.5" font-weight="600">03</tspan><tspan dx="6">you approve</tspan></text>
<text class="t2" x="415" y="58" font-size="12">before it pays</text>
