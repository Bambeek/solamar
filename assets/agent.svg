<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">Solamar's AI agent</title>
<desc id="d">How Solamar's built-in agent works, in four steps. 01 You ask, in plain words, on the page you are looking at. 02 It works right on that page: it reads, clicks and types, and shows each step live. 03 Payments wait for you: it asks and you click; asking before sending and deleting is one setting away. 04 You check the result, stop it any time, or follow up in the chat. AI is off until you turn it on; it runs on Claude with your own API key or on a local model through Ollama.</desc>
<style>
svg{--bg0:#FFFFFF;--bg1:#F3F4F9;--line:#E2E5EE;--grid:#D9DDE8;--ink:#0E1121;--t2:#3F465C;--t3:#5C6379;--acc:#5546E8;--acch:#7C6FFF;--accl:#3B2DC2;--accp:#ECEAFF;--accg:#8F84FF;--sht:#FFFFFF;--shl:#DCE0EA;--shr:#C2C8D7;--she:#B3BACB;--plt:#ECEEF5;--scr:#F6F7FB;--img:#1B2146;--imgw:#2A3466;--mtt:#D3D8E4;--mts:#9098AE;--mtd:#5D6580;--dt:#F4F2FF;--krt:#EBD6B0;--krl:#D9BE8F;--krr:#C4A673;--kre:#A88A58;--kri:#8C7044;--shadow:#1B2140}
@media (prefers-color-scheme:dark){svg{--bg0:#151A2A;--bg1:#0F1320;--line:#252C3F;--grid:#222940;--ink:#F2F4FA;--t2:#BCC2D3;--t3:#959CB2;--acc:#A398FF;--acch:#8F82FF;--accl:#6A5CF5;--accp:#24224A;--accg:#7B6CFF;--sht:#3A4364;--shl:#2A3150;--shr:#1F253D;--she:#56608C;--plt:#2E3655;--scr:#232A45;--img:#0B0E1B;--imgw:#1B2240;--mtt:#6C7598;--mts:#454D6E;--mtd:#2E3452;--dt:#E4E0FF;--krt:#7A6650;--krl:#635241;--krr:#4E4134;--kre:#8C765C;--kri:#3A3027;--shadow:#000000}}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ink{fill:var(--ink)}.t2{fill:var(--t2)}.t3{fill:var(--t3)}.acc{fill:var(--acc)}
.card{fill:url(#bg);stroke:var(--line)}
.grid{stroke:var(--grid);fill:none}
.sht{fill:var(--sht)}.shl{fill:var(--shl)}.shr{fill:var(--shr)}.she{fill:none;stroke:var(--she)}.plt{fill:var(--plt)}.scr{fill:var(--scr)}
.img{fill:var(--img)}.imgw{fill:none;stroke:var(--imgw);stroke-linecap:round}
.aT{fill:var(--acch)}.aL{fill:var(--acc)}.aR{fill:var(--accl)}.aP{fill:var(--accp)}
.tra{fill:none;stroke:var(--acch);stroke-linecap:round;stroke-linejoin:round}
.mtt{fill:var(--mtt)}.mts{fill:var(--mts)}.mtd{fill:var(--mtd)}.dT{fill:var(--dt)}
.krt{fill:var(--krt)}.krl{fill:var(--krl)}.krr{fill:var(--krr)}.kri{fill:var(--kri)}.kre{fill:none;stroke:var(--kre)}
.mtdS{stroke:var(--mtd)}.sheS{stroke:var(--she)}
.shadow{fill:var(--shadow)}
.s0{stop-color:var(--bg0)}.s1{stop-color:var(--bg1)}.sa{stop-color:var(--accg)}.sah{stop-color:var(--acch)}
.rib{fill:none;stroke:var(--line)}.pls{fill:none;stroke:var(--sht);opacity:.7}.chk{fill:none;stroke:var(--dt);stroke-linecap:round;stroke-linejoin:round}.code{fill:none;stroke:var(--mts);stroke-linecap:round}.term{fill:var(--img)}
.sml{stop-color:var(--shl)}.smr{stop-color:var(--shr)}
</style>
