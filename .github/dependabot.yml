# Opens a pull request when Electron (and with it Chromium) has a new release, so security fixes reach a Solamar
# release within a week (README, "Engine and security updates").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: electron
    open-pull-requests-limit: 3
